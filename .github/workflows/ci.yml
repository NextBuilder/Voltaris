name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc@3.23.4
          fallback: none
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked
      # Fast, named contract gate for the adopted outcome catalogue and the
      # reviewed legacy-debt ratchet. The full test step below remains the
      # regression gate; this makes contract drift immediately identifiable.
      - name: Reliability contract
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p voltaris-core --locked reliability_contract -- --nocapture
      - name: Test (unit + integration)
        run: cargo test --workspace --locked --lib --tests
      # --doc cannot be combined with --lib/--tests; doctests broke silently
      # once because they were never run in CI.
      - name: Doctests
        run: cargo test --workspace --locked --doc

  # The KiCad action plugin is Python, so cargo never sees it. Its only real
  # logic is the server-PID bookkeeping, where an unconditional
  # os.remove let one KiCad session delete another's record and leak an
  # unreapable server. The tests stub pcbnew/wx, so no KiCad is needed.
  plugin:
    name: Plugin (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test
        run: python -m unittest discover -s kicad-plugin/tests -v

  # schematic-viewer is intentionally outside the workspace (Tauri app), so
  # --workspace never touches it. Without this job a viewer break ships
  # silently: release builds it with continue-on-error and the PCM scripts
  # omit a missing viewer binary without failing.
  viewer:
    name: Schematic viewer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: viewer
          workspaces: crates/schematic-viewer
      - name: Check
        run: cargo check --locked --manifest-path crates/schematic-viewer/Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path crates/schematic-viewer/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc@3.23.4
          fallback: none
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests, benches and examples are linted too. Without it
      # test code is never checked, and it had accumulated real findings: eight
      # `MutexGuard` held across an await, a dropped coordinate that left half
      # of a transform assertion unwritten, and a handful of style lints.
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  # Dependency license gate (deny.toml): stops an AGPL-incompatible license
  # entering through a dependency bump.
  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  packaging:
    name: PCM packaging validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate repository metadata
        run: python packaging/validate-pcm.py --metadata packaging/metadata.json

      # Stub binaries carry each platform's executable magic: the validator
      # checks a package's bundled binary against the platform it declares,
      # which is what stops a Windows-only zip from being offered to every OS.
      - name: Assemble Windows PCM zip with a stub binary and validate structure
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("stub-voltaris.exe", [byte[]](0x4D, 0x5A, 0x90, 0x00))
          ./packaging/build-pcm.ps1 -Version 0.0.0 -BinaryPath stub-voltaris.exe `
            -Platform windows -OutDir dist
          python packaging/validate-pcm.py --zip dist/voltaris-pcm-v0.0.0-windows.zip

      # build-pcm.sh is what the macOS and Linux release packages are built
      # with, so it gets the same structural check.
      - name: Assemble Linux PCM zip with a stub binary and validate structure
        run: |
          set -euo pipefail
          printf '\177ELF\002\001\001\000' > stub-voltaris
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-voltaris \
            --platform linux --out dist
          python packaging/validate-pcm.py --zip dist/voltaris-pcm-v0.0.0-linux.zip

      - name: Reject a package whose binary contradicts its platform
        run: |
          set -euo pipefail
          # The exact mistake v0.1.3 shipped: a Windows binary in a package
          # non-Windows users are offered. The gate must fail here.
          printf 'MZ\220\000' > stub-voltaris-win
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-voltaris-win \
            --platform linux --out dist-bad
          if python packaging/validate-pcm.py --zip dist-bad/voltaris-pcm-v0.0.0-linux.zip; then
            echo "::error::validator accepted a Windows binary in a linux package"
            exit 1
          fi
          echo "OK: mismatched binary/platform correctly rejected"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Claude plugin folder matches the bundled skills and agents
        run: python packaging/build-claude-plugin.py --check
      - name: Pack and validate the Claude Desktop extension (.mcpb) with a stub binary
        run: |
          set -euo pipefail
          printf 'MZ\220\000' > stub-voltaris.exe
          ./packaging/build-mcpb.sh --version 0.0.0 --binary stub-voltaris.exe --platform win32 --out dist-mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 info dist-mcpb/voltaris-0.0.0-win32.mcpb
